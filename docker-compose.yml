# Throwaway local Postgres for running the test suite fast.
#   docker compose up -d --wait
#   uv run pytest   # tests/conftest.py points at this database by default
# Data lives in RAM (tmpfs) and fsync is off: fast, and gone when the container stops.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: proofpay
      POSTGRES_DB: proofpay
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpay"]
      interval: 1s
      timeout: 3s
      retries: 30
